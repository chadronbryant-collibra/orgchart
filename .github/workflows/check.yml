name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/check_public.py
      - run: python3 skills/orgchart/scripts/templates.py validate
      - run: python3 scripts/build_desktop_zip.py
      - run: python3 scripts/build_plugin_zip.py
